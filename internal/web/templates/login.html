{{define "content"}}
<div style="max-width:380px;margin:60px auto">
  <div class="card">
    <h1>🛡️ repoguard</h1>
    <p class="lead">Sign in to the admin console</p>
    {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <label for="pw">Password</label>
      <input id="pw" type="password" name="password" autofocus required>
      <div class="hint">The password is printed in the startup log (the <code>admin password</code> line), or is the value of <code>REPOGUARD_ADMIN_PASSWORD</code> if you set one.</div>
      <p><button type="submit">Sign in</button></p>
    </form>
  </div>
</div>
{{end}}
