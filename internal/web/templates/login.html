{{define "content"}}
<div style="max-width:380px;margin:60px auto">
  <div class="card">
    <h1>🛡️ repoguard</h1>
    <p class="lead">Đăng nhập trang quản trị</p>
    {{if .Error}}<div class="flash err">{{.Error}}</div>{{end}}
    <form method="post" action="/login">
      <label for="pw">Mật khẩu</label>
      <input id="pw" type="password" name="password" autofocus required>
      <div class="hint">Mật khẩu được in trong log lúc khởi động (dòng <code>admin password</code>), hoặc là giá trị <code>REPOGUARD_ADMIN_PASSWORD</code> nếu bạn đã đặt.</div>
      <p><button type="submit">Đăng nhập</button></p>
    </form>
  </div>
</div>
{{end}}
