<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{if .Refresh}}<meta http-equiv="refresh" content="15">{{end}}
<title>repoguard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--muted:#5d6678;--line:#e3e6eb;--accent:#2f6fde;--accent-text:#fff;--ok:#1a7f45;--ok-bg:#e6f4ec;--bad:#b42318;--bad-bg:#fdecea;--warn:#8a5a00;--warn-bg:#fff4dc}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b1f27;--text:#e6e9ef;--muted:#9aa3b2;--line:#2c323d;--accent:#5b8ef0;--accent-text:#0b0e13;--ok:#5fd08f;--ok-bg:#16301f;--bad:#ff8a80;--bad-bg:#3a1a18;--warn:#f2c46b;--warn-bg:#332a14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:20px;height:56px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;color:var(--text);text-decoration:none}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
nav a.on,nav a:hover{color:var(--text);background:var(--bg)}
main{padding:24px 0 48px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:17px;margin:0 0 12px}
p.lead{color:var(--muted);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.stat .label{color:var(--muted);font-size:13px}
.stat .value{font-weight:600;margin-top:4px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-bad{background:var(--bad-bg);color:var(--bad)}.b-warn{background:var(--warn-bg);color:var(--warn)}.b-mute{background:var(--bg);color:var(--muted)}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:16px}
.flash.ok{background:var(--ok-bg);color:var(--ok)}.flash.err{background:var(--bad-bg);color:var(--bad)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
.scroll{overflow-x:auto}
label{display:block;font-weight:600;margin:12px 0 4px}
.hint{color:var(--muted);font-size:13px;margin-top:4px}
input[type=text],input[type=password],input[type=url],input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--text);font:inherit}
button,.btn{display:inline-block;padding:8px 14px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.ghost,.btn.ghost{background:transparent;color:var(--accent)}
button.small{padding:4px 10px;font-size:13.5px}
button.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
form.inline{display:inline}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 40px;position:relative;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line);text-align:center;font-weight:700;font-size:13px;line-height:24px}
.steps li.done::before{content:"✓";background:var(--ok-bg);color:var(--ok);border-color:transparent}
code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13.5px}
a{color:var(--accent)}
.muted{color:var(--muted)}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:16px}
</style>
</head>
<body>
{{if ne .Page "login"}}
<header><div class="wrap top">
  <a class="brand" href="/">🛡️ repoguard</a>
  <nav>
    <a href="/" {{if eq .Page "overview"}}class="on"{{end}}>Tổng quan</a>
    <a href="/connect" {{if eq .Page "connect"}}class="on"{{end}}>Kết nối</a>
    <a href="/repos" {{if eq .Page "repos"}}class="on"{{end}}>Dự án</a>
    <a href="/guide" {{if eq .Page "guide"}}class="on"{{end}}>Hướng dẫn</a>
  </nav>
  <form class="inline" method="post" action="/logout"><button class="ghost small" type="submit">Đăng xuất</button></form>
</div></header>
{{end}}
<main><div class="wrap">
{{if .OK}}<div class="flash ok">{{.OK}}</div>{{end}}
{{if .Err}}<div class="flash err">{{.Err}}</div>{{end}}
{{template "content" .}}
</div></main>
<footer>repoguard {{.Version}}</footer>
</body>
</html>
