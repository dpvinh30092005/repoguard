# repoguard with CI builds: it can build merge requests itself when a project's
# pipelines are disabled. Open http://localhost:47474 afterwards.
#   docker compose -f deploy/docker-compose.executor.yml up -d
#   docker pull ghcr.io/dpvinh30092005/repoguard-ci:1   # build image (pulled on first build anyway)
#
# SECURITY: mounting the Docker socket gives this container root on the host.
# Use a dedicated VM, only turn CI builds on for projects you trust, and prefer
# REPOGUARD_EXECUTOR_RUNTIME=runsc (gVisor) if it is installed on the host.
services:
  repoguard:
    image: ghcr.io/dpvinh30092005/repoguard-executor:1     # `up --build` builds from source instead
    build:
      context: ..
      dockerfile: deploy/executor.Dockerfile
    env_file:
      - path: .env        # optional: everything can also be set in the web UI
        required: false
    environment:
      REPOGUARD_ADDR: ":47474"   # keep in sync with the port mapping below
    ports:
      - "47474:47474"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - repoguard-data:/data
    restart: unless-stopped

volumes:
  repoguard-data:
